name: offline-engine

on:
  # Runnable on demand from the Actions tab or `gh workflow run`.
  # Every trigger below is path-filtered, so a change that touches only
  # docs/ cannot start this workflow — which is correct, and leaves no
  # way to re-run a job against an unchanged tree when the question is
  # whether CI itself is healthy rather than whether the code changed.
  workflow_dispatch:
  push:
    paths: ['packages/offline/**', '.github/workflows/offline.yml']
  pull_request:
    paths: ['packages/offline/**', '.github/workflows/offline.yml']

jobs:
  test:
    name: outbox · sync · conflict policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # native TS type-stripping + node:test
      - run: npm ci || npm install --no-audit --no-fund
      - name: Test
        run: npm test
