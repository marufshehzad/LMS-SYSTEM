<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Matches the app's warm surface, not the retired green theme: the
       browser/status-bar chrome should be the same material as the header
       it sits above. -->
  <meta name="theme-color" content="#f3f2f2">

  <!-- Ata Ekta: light only. The F-1607 pre-paint theme script that chose
       between light and dark before first paint was removed with dark
       mode itself — there is one theme, so there is nothing to choose. -->
  <!-- Standalone PWA: let content flow under the status bar so our own
       safe-area padding (app.css) places the header correctly on notched
       phones. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- R-1: a neutral placeholder only. apps/pwa/src/branding.ts replaces
       this with the institution's own name on the first frame, from the
       localStorage cache, before any network request. It must not name the
       platform: a school's browser tab is the school's. -->
  <title>শিক্ষা প্রতিষ্ঠান</title>

  <!-- Ata Ekta §2 — Hind Siliguri for all text, Bangla and Latin; Anek Bangla
       for EVERY number (the .n class). preconnect first so the DNS+TLS
       handshake overlaps with the CSS request. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Anek+Bangla:wdth,wght@100,400;100,500;100,600;100,700&display=swap">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- use-credentials: on SSO-protected Vercel preview URLs the manifest
       fetch must carry the auth cookie or it 302s into vercel.com/sso-api
       and dies on CORS. Production (shikhon-lms.vercel.app) is public and
       unaffected either way. -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
</head>
<body>
  <!-- The shell renders before any data arrives, so a cold offline start
       shows a working screen rather than an error page. -->
  <main id="root" lang="bn">
    <p class="att-sub" style="padding:var(--s-4)">লোড হচ্ছে…</p>
  </main>

  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
